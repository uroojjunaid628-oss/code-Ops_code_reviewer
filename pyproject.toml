[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeops-ai"
version = "0.1.0"
description = "Agentic AI code review and verification system"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "ruff",
    "bandit",
    "GitPython",
    "langchain-ollama",
    "langchain-core",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]